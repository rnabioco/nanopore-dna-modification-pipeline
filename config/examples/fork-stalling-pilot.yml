# Example project config: the fork-stalling pilot (BrdU/EdU pulse, P2 flowcell,
# MinKNOW live-basecalled with sup@v5.2.0 + 6mA, aligned to CHM13v2.0).
#
# Mirrors the manual workflow in the fork-stalling pilot's run_*_DNAscent.sh scripts:
#   merge bam_pass -> dorado aligner -> sort -> DNAscent index/detect
#   -> per-read BrdU/EdU probabilities -> forkSense --order EdU,BrdU
# The run is marked `basecalled: true`, so dorado is not re-run and the models
# config is ignored; set basecalled: false to re-basecall with the stack below.
#
#   pixi run run-bodhi --configfile config/examples/fork-stalling-pilot.yml

samples: config/examples/fork-stalling-pilot-samples.yml
output_directory: results/fork-stalling-pilot

reference:
  fasta: /beevol/home/<user>/reference_files/chm13v2.0.fa

# Only relevant if a run is re-basecalled (basecalled: false).
models:
  simplex: dna_r10.4.1_e8.2_400bps_sup@v5.2.0
  modified_bases: [6mA]

modkit:
  # 6mA from the MinKNOW basecall; the pileup is the whole-genome 6mA table.
  pileup: true
  summary: true

dnascent:
  enabled: true
  # Bodhi's cluster image (DNAscent 4.1.1). Use the pinned 4.2.1 from
  # `pixi run install-dnascent` by setting this to null.
  sif: /cluster/singularity_images/DNAscent.sif
  gpu: true
  min_mapq: 20
  min_length: 1000
  per_read_probs: true
  forksense:
    enabled: true
    order: "EdU,BrdU"
    opts: "--markAnalogues --markOrigins --markTerminations --markForks --makeSignatures"
