# Pre-commit hooks. Install: pre-commit install
#
# These run the SAME tools as `pixi run lint`, so a clean commit here is a
# green Lint workflow. Every rev is the version pixi installs; bump together.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        files: ^(workflow/scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(workflow/scripts|tests)/.*\.py$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: ^(config|cluster|\.github)/.*\.(yml|yaml)$

  - repo: https://github.com/snakemake/snakefmt
    rev: v2.0.3
    hooks:
      - id: snakefmt
        files: ^workflow/.*\.(smk|Snakefile)$
